name: bidly_app
description: Bidly — OLX-like classifieds marketplace for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ───────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ─────────────────────────────────────────────
  go_router: ^14.6.0

  # ── Networking ─────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── Local Storage ──────────────────────────────────────────
  flutter_secure_storage: ^9.2.2      # JWT token storage
  shared_preferences: ^2.3.2          # App settings

  # ── Media ──────────────────────────────────────────────────
  image_picker: ^1.1.2                # Camera/gallery picker
  path_provider: ^2.1.4               # Persistent app storage
  cached_network_image: ^3.4.1        # CDN image caching
  photo_view: ^0.15.0                 # Full-screen image viewer
  video_player: ^2.9.2                # Video playback

  # ── UI Components ──────────────────────────────────────────
  flutter_svg: ^2.0.10+1             # SVG icons
  shimmer: ^3.0.0                     # Loading skeletons
  lottie: ^3.1.3                      # Lottie animations
  smooth_page_indicator: ^1.2.0+3     # Onboarding dots
  intl: ^0.19.0                       # Number/date formatting
  timeago: ^3.7.0                     # "2 hours ago" style dates

  # ── Forms ──────────────────────────────────────────────────
  pinput: ^5.0.0                      # OTP input field
  flutter_form_builder: ^9.4.0        # Form management

  # ── Maps & Location ────────────────────────────────────────
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # ── Typography ─────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Permissions & Utils ────────────────────────────────────
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
